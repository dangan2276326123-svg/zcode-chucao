# E3 车辆档案（spec §6）。
#
# ⚠️ 2026-10-15 作者裁定：**上电握手这一用途已取消**——原话"PROFILE_ID 这个可以取消，
# 两辆车没区别，唯二就是车宽以及样机上行走和转向电机与固件不匹配……其他逻辑问题
# 设计成两辆车通用不就好了"。⇒ `MODE(0x20)` 那条握手、固件侧的 `retrofit.h:26 PROFILE_ID`
# 与 `REJ_PROFILE` 都不再是准入条件（登记处 = 台账 §4 那条 10-15 记录）。
# 本文件因此从"握手 + 许可"退成两件事：**许可位**（permit）与**车型标记**（log_tag）。
#
# profile_id: 1 = PREV 上代车（3.25 m，装控制栈试验用）
#             2 = REAL 样机（2.15 m，在地里）
#             —— 取消握手后这一位**不再参与任何准入判定**，只作为 PC 侧记录保留；
#                固件侧那一行常量本批未动（改它要走重编译 + 五处同步，另批）。
# permit:     gate_n = 只许沿行空跑（刀强制提、横移禁）  <- 门 N 用这个
#             gate_f = 允许落刀作业与横移（门 F，需 B5 全项 + 刀控 + 滑台接线）
# log_tag:    写进 `run_log.csv` 每一行的车型标记（台账 Pc-10）。
#             **这一列是取消握手之后唯一保住"数据属于哪台车"的东西**：
#             v1.0 §4.1 规定凡横向指标不得跨车引用（上代车 3.25 m／轮距 301，
#             样机 2.15 m／轮距 191），日志认不出车，那条规则就无法执行、
#             论文也无法给每个横向数据标注来源。取值要求 1~24 位
#             字母/数字/_/.-（它直接进 CSV，逗号与空格会写坏表），
#             缺失或不合法 ⇒ 启动即报错停下，**不回默认值**——
#             一个静默的默认车型会造出"每行都有车型、其实全是猜的"的表。
#
# ⚠️ 运行中不热切（v1.0 §4.3 的这条理由与握手无关，继续成立）：换车当天要重新上电
#    接线，改这个文件也要重启程序，所以"热切"省下的时间≈0，而换来的是控制量跳变。
profile_id: 1
permit: gate_n
log_tag: prev
